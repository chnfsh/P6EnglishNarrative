<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英文单词错题本 · 拼写默写复习</title>
<style>
  :root{
    --paper:#FAF6EC;
    --paper-shadow:#EDE6D3;
    --ink:#242422;
    --ink-soft:#5b564a;
    --rule:#d8cfb6;
    --red:#B5312C;
    --red-soft:#e7d4d1;
    --green:#3f6b4a;
    --green-soft:#dbe6dc;
    --gold:#a9822f;
    --blue:#2f5fa8;
    --card-shadow: 0 2px 0 rgba(36,36,34,0.06), 0 10px 24px -14px rgba(36,36,34,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 700px at 10% -10%, #fffdf6 0%, var(--paper) 45%),
      var(--paper);
    color:var(--ink);
    font-family: "Source Serif 4","Noto Serif SC","Songti SC", Georgia, "Times New Roman", serif;
    min-height:100vh;
    padding-bottom:64px;
  }
  .wrap{max-width:720px; margin:0 auto; padding:0 16px;}

  header.top{
    position:sticky; top:0; z-index:20;
    background:rgba(250,246,236,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--rule);
  }
  .top-inner{
    max-width:720px;margin:0 auto;padding:12px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand{display:flex; flex-direction:column; line-height:1.15;}
  .brand b{font-size:16px; letter-spacing:.5px;}
  .brand span{font-size:11px; color:var(--ink-soft); font-family:Georgia,serif; letter-spacing:1px;}
  .top-inner a.back{
    font-size:12.5px; color:var(--ink-soft); text-decoration:none; border:1px solid var(--rule);
    background:#fff8ea; padding:6px 12px; border-radius:999px; white-space:nowrap;
  }
  .top-inner a.back:hover{color:var(--ink); border-color:var(--gold);}

  h1.page-title{font-size:20px; margin:22px 0 4px; letter-spacing:.3px;}
  p.page-sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 14px; line-height:1.7;}

  .exam-banner{
    background:#fff8ea; border:1px dashed var(--gold); border-radius:3px;
    padding:9px 12px; font-size:12.5px; color:var(--ink-soft); margin-bottom:18px; text-align:center;
  }
  .exam-banner b{color:var(--red);}

  /* ---- dashboard stat strip ---- */
  .stat-strip{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px;}
  .stat-card{
    background:#fffef9; border:1px solid var(--rule); border-radius:3px; box-shadow:var(--card-shadow);
    padding:14px 10px; text-align:center;
  }
  .stat-card b{display:block; font-size:22px; font-family:Georgia,serif; color:var(--ink);}
  .stat-card span{font-size:11.5px; color:var(--ink-soft);}
  .stat-card.due b{color:var(--red);}
  .stat-card.mastered b{color:var(--green);}

  .action-row{display:flex; gap:10px; margin:6px 0 12px; flex-wrap:wrap;}
  .btn{
    font-family:"Noto Serif SC",serif; font-size:14px; padding:11px 20px; border-radius:3px;
    border:1px solid var(--ink); background:var(--ink); color:var(--paper); cursor:pointer;
  }
  .btn.secondary{background:transparent; color:var(--ink); border:1px solid var(--rule);}
  .btn.cram{background:transparent; color:var(--blue); border:1px solid var(--blue);}
  .btn.danger{background:transparent; color:var(--red); border:1px solid var(--red);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.block{display:block; width:100%; text-align:center;}

  /* ---- schedule note ---- */
  .schedule-note{
    font-size:11.5px; color:var(--ink-soft); background:#fff8ea; border:1px dashed var(--rule);
    border-radius:3px; padding:10px 12px; margin-bottom:20px; line-height:1.7;
  }
  .schedule-note b{color:var(--gold);}

  /* ---- add word form ---- */
  .add-form{
    background:#fffef9; border:1px solid var(--rule); border-radius:3px; box-shadow:var(--card-shadow);
    padding:20px; margin-bottom:22px; display:none;
  }
  .add-form.open{display:block;}
  .add-form h3{margin:0 0 14px; font-size:15px;}
  .add-form label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:4px;}
  .add-form input[type=text], .add-form textarea{
    width:100%; font-family:inherit; font-size:14px; padding:9px 10px; border:1px solid var(--rule);
    border-radius:2px; background:#fffef9; color:var(--ink); margin-bottom:14px;
  }
  .add-form textarea{resize:vertical; min-height:60px;}
  .add-form input:focus, .add-form textarea:focus{outline:none; border-color:var(--gold); background:#fbf3df;}
  .mode-toggle{display:flex; gap:8px; margin-bottom:16px;}
  .mode-toggle button{
    flex:1; font-family:"Noto Serif SC",serif; font-size:12.5px; padding:7px 8px; border-radius:999px;
    border:1px solid var(--rule); background:#fff8ea; color:var(--ink-soft); cursor:pointer;
  }
  .mode-toggle button.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .tier-toggle{display:flex; gap:8px; margin-bottom:16px;}
  .tier-toggle button{
    flex:1; font-family:"Noto Serif SC",serif; font-size:12px; padding:7px 8px; border-radius:4px;
    border:1px solid var(--rule); background:#fff8ea; color:var(--ink-soft); cursor:pointer; text-align:center;
  }
  .tier-toggle button.active[data-tier="test"]{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .tier-toggle button.active[data-tier="familiar"]{background:var(--blue); color:#fff; border-color:var(--blue);}
  .tier-hint{font-size:11.5px; color:var(--ink-soft); margin:-8px 0 12px; line-height:1.6;}
  .bulk-hint{font-size:11.5px; color:var(--ink-soft); margin:-8px 0 12px; line-height:1.6;}

  /* ---- word list ---- */
  .word-card{
    background:#fffef9; border:1px solid var(--rule); border-radius:3px; box-shadow:var(--card-shadow);
    padding:16px 18px; margin-bottom:12px; position:relative;
  }
  .word-card.due{border-left:4px solid var(--red);}
  .word-card.mastered{border-left:4px solid var(--green); opacity:.85;}
  .word-card.familiar{border-left:4px solid var(--blue); opacity:.9;}
  .familiar-badge{
    display:inline-block; font-size:10.5px; color:var(--blue); border:1px solid var(--blue);
    border-radius:999px; padding:1px 8px; margin-left:6px; vertical-align:middle;
  }
  .word-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .word-en{font-size:17px; font-weight:600;}
  .word-ipa{font-size:12px; color:var(--gold); font-family:Georgia,serif; margin-top:2px;}
  .word-zh{font-size:13.5px; color:var(--ink-soft); margin-top:2px;}
  .word-ex{font-size:12.5px; color:var(--ink-soft); font-style:italic; margin-top:6px; line-height:1.6;}
  .word-actions{display:flex; gap:6px; flex-shrink:0;}
  .icon-btn{
    border:1px solid var(--rule); background:#fff8ea; color:var(--ink-soft); border-radius:3px;
    padding:4px 8px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .icon-btn:hover{border-color:var(--gold); color:var(--ink);}
  .progress-row{display:flex; align-items:center; gap:8px; margin-top:12px;}
  .dots{display:flex; gap:4px;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--rule);}
  .dot.filled{background:var(--gold);}
  .dot.current{background:var(--red); box-shadow:0 0 0 2px var(--red-soft);}
  .countdown-label{font-size:11.5px; color:var(--ink-soft); margin-left:auto; white-space:nowrap;}
  .countdown-label.due{color:var(--red); font-weight:600;}
  .countdown-label.mastered{color:var(--green); font-weight:600;}

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-soft); font-size:14px; line-height:1.8;
  }
  .empty-state .big{font-size:34px; display:block; margin-bottom:10px;}

  .section-h{font-size:14px; color:var(--ink-soft); margin:26px 0 10px; border-bottom:1px solid var(--rule); padding-bottom:6px;}

  /* ---- review panel (shared) ---- */
  .review-wrap{display:flex; flex-direction:column; align-items:center; padding:24px 6px 10px;}
  .review-progress{font-size:12px; color:var(--ink-soft); margin-bottom:4px; font-family:Georgia,serif; letter-spacing:1px;}
  .review-round{font-size:11px; color:var(--gold); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:14px;}
  .panel{
    width:100%; max-width:460px; background:#fffef9; border:1px solid var(--rule);
    border-radius:4px; box-shadow:var(--card-shadow); padding:28px 22px; text-align:center; position:relative;
  }
  .panel::before{
    content:""; position:absolute; left:0; right:0; top:0; height:5px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 14px, transparent 14px 22px);
    opacity:.35; border-radius:4px 4px 0 0;
  }

  /* preview stage */
  .preview-en{font-size:26px; font-weight:600; margin-bottom:4px;}
  .preview-ipa{font-size:13.5px; color:var(--gold); font-family:Georgia,serif; margin-bottom:10px;}
  .preview-zh{font-size:16px; margin-top:8px;}
  .preview-ex{font-size:13px; color:var(--ink-soft); font-style:italic; margin-top:10px; line-height:1.6;}
  .audio-btn{
    display:inline-flex; align-items:center; gap:6px; font-family:"Noto Serif SC",serif; font-size:13px;
    padding:8px 16px; border-radius:999px; border:1px solid var(--gold); background:#fff8ea; color:var(--gold);
    cursor:pointer; margin-top:10px;
  }
  .audio-btn:hover{background:var(--gold); color:#fff;}
  .audio-note{font-size:11.5px; color:var(--ink-soft); margin-top:8px;}

  /* blind test stage */
  .test-label{font-size:12px; color:var(--ink-soft); margin-bottom:16px;}
  .phonetic-big{font-size:22px; color:var(--gold); font-family:Georgia,serif; margin:6px 0 4px;}

  .letter-row{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:14px 0;}
  .letter-fixed{
    display:inline-flex; align-items:center; justify-content:center; min-width:26px; height:36px;
    font-size:17px; font-weight:600; color:var(--ink-soft);
  }
  .letter-fixed.space{min-width:12px;}
  .letter-input{
    width:30px; height:36px; text-align:center; font-size:17px; font-family:inherit;
    border:none; border-bottom:2px solid var(--gold); background:transparent; color:var(--ink);
  }
  .letter-input:focus{outline:none; background:#fff8ea;}
  .letter-input.correct{border-bottom-color:var(--green); color:var(--green); background:var(--green-soft);}
  .letter-input.wrong{border-bottom-color:var(--red); color:var(--red); background:var(--red-soft);}

  .single-input{
    width:100%; max-width:340px; font-size:19px; font-family:inherit; text-align:center;
    padding:10px 12px; border:none; border-bottom:2px solid var(--gold); background:transparent;
    color:var(--ink); margin:14px 0;
  }
  .single-input:focus{outline:none; background:#fff8ea;}
  .single-input.correct{border-bottom-color:var(--green); color:var(--green); background:var(--green-soft);}
  .single-input.wrong{border-bottom-color:var(--red); color:var(--red); background:var(--red-soft);}

  .feedback-note{
    margin-top:16px; padding:12px 14px; border-radius:3px; font-size:13px; line-height:1.7;
    background:#fff8ea; border:1px dashed var(--rule); color:var(--ink-soft); text-align:left;
  }
  .feedback-note b{color:var(--ink);}
  .feedback-verdict{font-size:15px; font-weight:600; margin-bottom:6px;}
  .feedback-verdict.correct{color:var(--green);}
  .feedback-verdict.wrong{color:var(--red);}

  .panel-actions{width:100%; max-width:460px; margin-top:16px; display:flex; gap:10px;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:9px 18px; border-radius:4px; font-size:13px;
    box-shadow:0 8px 20px rgba(0,0,0,.25); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  .hidden{display:none !important;}
  .back-link{
    display:inline-flex; align-items:center; gap:4px; font-size:13px; color:var(--ink-soft);
    cursor:pointer; margin:16px 0 4px; user-select:none;
  }
  .back-link:hover{color:var(--ink);}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <b>英文单词错题本</b>
      <span>SPELLING · SPACED REPETITION</span>
    </div>
    <a class="back" href="index.html">← 返回专练首页</a>
  </div>
</header>

<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var LS_KEY = 'p6vocab_words_v1';
  // Review checkpoints, in days since the word's cycle-start date.
  // Spacing loosely modelled on the Ebbinghaus forgetting curve.
  // 6 checkpoints = 6 consecutive correct spellings required for mastery.
  var CHECKPOINTS = [1, 2, 4, 7, 11, 15];
  var EXAM_DATE = '2026-09-24';

  // Which testing method is used at each checkpoint (0-indexed).
  // 'preview+partial'  -> show word+audio+meaning first, then hide; blanks show only middle letters missing (first/last letter kept as hints)
  // 'preview+blank'    -> show word+audio+meaning first, then hide; single blank, no letter hints at all
  // 'audio'            -> no preview; only plays pronunciation; type the word from sound alone
  // 'phonetic'         -> no preview; only shows the IPA/phonetic guide; type the word from that alone
  // 'random'           -> no preview; randomly picks one of audio / phonetic / blank / partial-letters each time
  var ROUND_PLAN = ['preview+partial', 'preview+blank', 'audio', 'phonetic', 'random', 'random'];

  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function addDays(dateStr, days){
    var d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()+days);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function daysBetween(a, b){
    var da = new Date(a+'T00:00:00'), db = new Date(b+'T00:00:00');
    return Math.round((db-da)/86400000);
  }

  function loadWords(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveWords(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(words)); }catch(e){} }

  var words = loadWords();
  var uidCounter = Date.now();
  function newId(){ uidCounter += 1; return 'w'+uidCounter; }

  function recompute(w){
    if(w.mastered){ w.nextReviewAt = null; return; }
    // defensive clamp: older data saved under a longer checkpoint scale may carry
    // a checkpointIndex beyond the current (shorter) CHECKPOINTS array.
    if(w.checkpointIndex >= CHECKPOINTS.length) w.checkpointIndex = CHECKPOINTS.length - 1;
    var idx = Math.min(w.checkpointIndex, CHECKPOINTS.length-1);
    w.nextReviewAt = addDays(w.cycleStart, CHECKPOINTS[idx]);
  }
  words.forEach(recompute);
  saveWords();

  function isTestTier(w){
    return w.tier !== 'familiar'; // undefined/'test' both count as the full spelling-test tier
  }
  function isDue(w){
    return isTestTier(w) && !w.mastered && w.nextReviewAt && w.nextReviewAt <= todayStr();
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.classList.remove('show'); }, 1700);
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function normalize(s){
    return (s||'').trim().toLowerCase().replace(/\s+/g,' ');
  }

  function speak(text){
    try{
      if(!('speechSynthesis' in window)) return false;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
      return true;
    }catch(e){ return false; }
  }
  var SPEECH_SUPPORTED = (typeof window !== 'undefined') && ('speechSynthesis' in window);

  var app = document.getElementById('app');
  var route = {name:'home'};
  var addFormMode = 'single'; // 'single' | 'bulk'
  var addFormTier = 'test'; // 'test' (full spelling review) | 'familiar' (recognize-only, skips spelling review)

  function go(r){ route = r; render(); window.scrollTo(0,0); }

  function render(){
    if(route.name === 'home') return renderHome();
    if(route.name === 'review') return renderReview();
  }

  function examCountdownHtml(){
    var days = daysBetween(todayStr(), EXAM_DATE);
    if(days < 0) return '';
    return '<div class="exam-banner">距离 9 月 24 日考试还有 <b>'+days+'</b> 天</div>';
  }

  // ---------- HOME ----------
  function renderHome(){
    var testWords = words.filter(isTestTier);
    var familiarWords = words.filter(function(w){ return !isTestTier(w); });
    var dueList = testWords.filter(isDue);
    var masteredCount = testWords.filter(function(w){ return w.mastered; }).length;
    var activeCount = testWords.length - masteredCount;

    var html = '';
    html += '<h1 class="page-title">我的错词本</h1>';
    html += '<p class="page-sub">每个新词加入后，会在第 <b>1、2、4、7、11、15</b> 天各默写一次，方式逐次升级：①看词+读音后隐去，露出首尾字母默写中间 ②看词+读音后隐去，整词默写 ③只听读音默写 ④只看音标默写 ⑤⑥随机抽一种方式再考——连续 6 次全部拼对才算掌握；期间任何一次拼错，都会整个重新从第 1 次开始计。标为"仅熟悉"的词不进入默写复习，只在词表里随时查看。</p>';
    html += examCountdownHtml();

    html += '<div class="stat-strip">'
      + '<div class="stat-card due"><b>'+dueList.length+'</b><span>今日待复习</span></div>'
      + '<div class="stat-card"><b>'+activeCount+'</b><span>复习中</span></div>'
      + '<div class="stat-card mastered"><b>'+masteredCount+'</b><span>已掌握</span></div>'
      + '</div>';

    html += '<div class="action-row">';
    if(dueList.length > 0){
      html += '<button class="btn" id="startReviewBtn">开始今日复习（'+dueList.length+' 个）</button>';
    } else {
      html += '<button class="btn" disabled>今天没有需要复习的词啦</button>';
    }
    if(activeCount > 0){
      html += '<button class="btn cram" id="startCramBtn">考前总复习（'+activeCount+' 个，不看日期）</button>';
    }
    html += '<button class="btn secondary" id="toggleAddBtn">+ 添加新错词</button>';
    html += '</div>';
    if(activeCount > 0){
      html += '<div class="schedule-note"><b>考前总复习</b>会把所有还没掌握的词（不管是不是今天该复习）都拿出来再考一遍，拼对照常推进进度，拼错照常清零重来——适合考前几天想集中再练一轮的时候用。</div>';
    }
    if(!SPEECH_SUPPORTED){
      html += '<div class="schedule-note">⚠️ 这台设备/浏览器不支持语音朗读功能，涉及"播放读音"的复习方式会自动改为凭拼写记忆完成，不影响其他功能。</div>';
    }

    html += '<div class="add-form" id="addForm">'
      + '<h3>添加错词</h3>'
      + '<div class="mode-toggle">'
        + '<button data-mode="single" class="'+(addFormMode==='single'?'active':'')+'">单个添加</button>'
        + '<button data-mode="bulk" class="'+(addFormMode==='bulk'?'active':'')+'">批量添加</button>'
      + '</div>'
      + '<div class="tier-toggle">'
        + '<button data-tier="test" class="'+(addFormTier==='test'?'active':'')+'">需要默写掌握</button>'
        + '<button data-tier="familiar" class="'+(addFormTier==='familiar'?'active':'')+'">仅熟悉（跳过默写）</button>'
      + '</div>'
      + '<div class="tier-hint">'+(addFormTier==='test'
          ? '进入 6 轮默写复习，连续拼对 6 次才算掌握。'
          : '不进入默写复习，只会出现在下面的"熟悉词表"里，随时可以查看词义和读音；以后想认真默写了，可以在词表里点"升级为默写"。')
        +'</div>';

    if(addFormMode === 'single'){
      html += ''
        + '<label>英文单词 / 短语</label>'
        + '<input type="text" id="inpWord" placeholder="例如：persevere">'
        + '<label>音标（选填）</label>'
        + '<input type="text" id="inpIpa" placeholder="例如：/pɜːrsɪˈvɪr/">'
        + '<label>中文意思</label>'
        + '<input type="text" id="inpMeaning" placeholder="例如：坚持不懈">'
        + '<label>例句 / 备注（选填）</label>'
        + '<textarea id="inpExample" placeholder="例如：She persevered despite the setbacks."></textarea>'
        + '<button class="btn block" id="submitSingle">加入错题本</button>';
    } else {
      html += ''
        + '<div class="bulk-hint">每行一个词，格式：<b>单词 — 音标 — 中文意思 — 例句(选填)</b>，用"—"隔开；如果没有音标，用旧格式 <b>单词 — 中文意思 — 例句</b> 也可以（该词会先没有音标，第4遍默写会自动改用听读音代替）。上面选的"需要默写掌握 / 仅熟悉"会应用到这整批词。</div>'
        + '<textarea id="inpBulk" style="min-height:120px;" placeholder="persevere — /pɜːrsɪˈvɪr/ — 坚持不懈 — She persevered despite the setbacks.\nintimidating — 令人生畏的 — The tall man looked intimidating."></textarea>'
        + '<button class="btn block" id="submitBulk">批量加入错题本</button>';
    }
    html += '</div>';

    if(words.length === 0){
      html += '<div class="empty-state"><span class="big">📔</span>错题本还是空的<br>点上面「+ 添加新错词」开始收集吧</div>';
    } else {
      var dueIds = {}; dueList.forEach(function(w){ dueIds[w.id]=true; });
      var activeWords = testWords.filter(function(w){ return !w.mastered; })
        .sort(function(a,b){ return (a.nextReviewAt||'') < (b.nextReviewAt||'') ? -1 : 1; });
      var masteredWords = testWords.filter(function(w){ return w.mastered; });

      if(activeWords.length){
        html += '<div class="section-h">复习中（'+activeWords.length+'）</div>';
        activeWords.forEach(function(w){ html += wordCardHtml(w, dueIds[w.id]); });
      }
      if(masteredWords.length){
        html += '<div class="section-h">已掌握（'+masteredWords.length+'）</div>';
        masteredWords.forEach(function(w){ html += wordCardHtml(w, false); });
      }
      if(familiarWords.length){
        html += '<div class="section-h">熟悉词表（'+familiarWords.length+'，不计入默写复习）</div>';
        familiarWords.forEach(function(w){ html += familiarCardHtml(w); });
      }
    }

    app.innerHTML = html;
    bindHomeEvents();
  }

  function wordCardHtml(w, due){
    var cls = w.mastered ? 'mastered' : (due ? 'due' : '');
    var dots = '';
    for(var i=0;i<CHECKPOINTS.length;i++){
      var dc = 'dot';
      if(w.mastered || i < w.checkpointIndex) dc += ' filled';
      else if(i === w.checkpointIndex) dc += ' current';
      dots += '<span class="'+dc+'"></span>';
    }
    var countdownHtml;
    if(w.mastered){
      countdownHtml = '<span class="countdown-label mastered">✓ 已掌握</span>';
    } else if(due){
      countdownHtml = '<span class="countdown-label due">今天该复习了</span>';
    } else {
      var daysLeft = daysBetween(todayStr(), w.nextReviewAt);
      countdownHtml = '<span class="countdown-label">'+daysLeft+' 天后复习（第'+CHECKPOINTS[w.checkpointIndex]+'天）</span>';
    }
    return '<div class="word-card '+cls+'" data-id="'+w.id+'">'
      + '<div class="word-row">'
        + '<div><div class="word-en">'+escapeHtml(w.word)+'</div>'
        + (w.ipa ? '<div class="word-ipa">'+escapeHtml(w.ipa)+'</div>' : '')
        + '<div class="word-zh">'+escapeHtml(w.meaning)+'</div>'
        + (w.example ? '<div class="word-ex">'+escapeHtml(w.example)+'</div>' : '')
        + '</div>'
        + '<div class="word-actions"><button class="icon-btn" data-del="'+w.id+'">删除</button></div>'
      + '</div>'
      + '<div class="progress-row"><div class="dots">'+dots+'</div>'+countdownHtml+'</div>'
      + '</div>';
  }

  function familiarCardHtml(w){
    return '<div class="word-card familiar" data-id="'+w.id+'">'
      + '<div class="word-row">'
        + '<div><div class="word-en">'+escapeHtml(w.word)+'<span class="familiar-badge">仅熟悉</span></div>'
        + (w.ipa ? '<div class="word-ipa">'+escapeHtml(w.ipa)+'</div>' : '')
        + '<div class="word-zh">'+escapeHtml(w.meaning)+'</div>'
        + (w.example ? '<div class="word-ex">'+escapeHtml(w.example)+'</div>' : '')
        + '</div>'
        + '<div class="word-actions">'
          + (SPEECH_SUPPORTED ? '<button class="icon-btn" data-speak="'+w.id+'">🔊</button>' : '')
          + '<button class="icon-btn" data-promote="'+w.id+'">升级为默写</button>'
          + '<button class="icon-btn" data-del="'+w.id+'">删除</button>'
        + '</div>'
      + '</div>'
      + '</div>';
  }

  function bindHomeEvents(){
    var startBtn = document.getElementById('startReviewBtn');
    if(startBtn) startBtn.onclick = function(){ go({name:'review', mode:'due', reset:true}); };
    var cramBtn = document.getElementById('startCramBtn');
    if(cramBtn) cramBtn.onclick = function(){ go({name:'review', mode:'cram', reset:true}); };

    document.getElementById('toggleAddBtn').onclick = function(){
      var f = document.getElementById('addForm');
      f.classList.toggle('open');
    };

    Array.prototype.forEach.call(app.querySelectorAll('.mode-toggle button'), function(btn){
      btn.onclick = function(){
        addFormMode = btn.getAttribute('data-mode');
        document.getElementById('addForm').classList.add('open');
        renderHome();
      };
    });
    Array.prototype.forEach.call(app.querySelectorAll('.tier-toggle button'), function(btn){
      btn.onclick = function(){
        addFormTier = btn.getAttribute('data-tier');
        document.getElementById('addForm').classList.add('open');
        renderHome();
      };
    });

    var submitSingle = document.getElementById('submitSingle');
    if(submitSingle){
      submitSingle.onclick = function(){
        var wordVal = document.getElementById('inpWord').value.trim();
        var ipaVal = document.getElementById('inpIpa').value.trim();
        var meaningVal = document.getElementById('inpMeaning').value.trim();
        var exampleVal = document.getElementById('inpExample').value.trim();
        if(!wordVal || !meaningVal){ showToast('请至少填写单词和中文意思'); return; }
        addWord(wordVal, ipaVal, meaningVal, exampleVal, addFormTier);
        showToast('已加入：'+wordVal);
        renderHome();
        document.getElementById('addForm').classList.add('open');
      };
    }
    var submitBulk = document.getElementById('submitBulk');
    if(submitBulk){
      submitBulk.onclick = function(){
        var raw = document.getElementById('inpBulk').value;
        var lines = raw.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
        var count = 0;
        lines.forEach(function(line){
          var parts;
          if(line.indexOf('—') !== -1){
            parts = line.split('—');
          } else if(line.indexOf('\t') !== -1){
            parts = line.split('\t');
          } else {
            parts = line.split(',');
          }
          parts = parts.map(function(p){ return p.trim(); }).filter(Boolean);
          if(parts.length >= 4){
            // word — ipa — meaning — example (example may itself contain extra dashes, so join the rest)
            addWord(parts[0], parts[1], parts[2], parts.slice(3).join(' — '), addFormTier);
            count++;
          } else if(parts.length === 3){
            // legacy format without ipa: word — meaning — example
            addWord(parts[0], '', parts[1], parts[2], addFormTier);
            count++;
          } else if(parts.length === 2){
            addWord(parts[0], '', parts[1], '', addFormTier);
            count++;
          }
        });
        if(count === 0){ showToast('没有识别到有效的词条，请检查格式'); return; }
        showToast('已批量加入 '+count+' 个词');
        renderHome();
        document.getElementById('addForm').classList.add('open');
      };
    }

    Array.prototype.forEach.call(app.querySelectorAll('[data-del]'), function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        var id = btn.getAttribute('data-del');
        words = words.filter(function(w){ return w.id !== id; });
        saveWords();
        renderHome();
      };
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-promote]'), function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        var id = btn.getAttribute('data-promote');
        var w = words.find(function(x){ return x.id === id; });
        if(w){
          w.tier = 'test';
          w.cycleStart = todayStr();
          w.checkpointIndex = 0;
          w.mastered = false;
          recompute(w);
          saveWords();
          showToast('已升级为默写：'+w.word);
          renderHome();
        }
      };
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-speak]'), function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        var id = btn.getAttribute('data-speak');
        var w = words.find(function(x){ return x.id === id; });
        if(w) speak(w.word);
      };
    });
  }

  function addWord(word, ipa, meaning, example, tier){
    var w = {
      id: newId(),
      word: word,
      ipa: ipa || '',
      meaning: meaning,
      example: example || '',
      tier: tier === 'familiar' ? 'familiar' : 'test',
      cycleStart: todayStr(),
      checkpointIndex: 0,
      mastered: false,
      nextReviewAt: null
    };
    recompute(w);
    words.push(w);
    saveWords();
  }

  // ---------- SPELLING HELPERS ----------
  var LETTER_METHODS = ['audio', 'phonetic', 'blank', 'partial'];

  function buildSkeleton(word){
    var tokens = word.split(' ');
    var skeleton = [];
    tokens.forEach(function(token, ti){
      var chars = token.split('');
      chars.forEach(function(ch, i){
        var isEdge = (i===0 || i===chars.length-1);
        if(/[a-zA-Z]/.test(ch) && !isEdge){
          skeleton.push({type:'blank', ch:ch});
        } else {
          skeleton.push({type:'fixed', ch:ch});
        }
      });
      if(ti < tokens.length-1) skeleton.push({type:'fixed', ch:' '});
    });
    return skeleton;
  }

  function pickRoundMethod(w, plannedStep){
    if(plannedStep === 'preview+partial') return {showPreview:true, method:'partial'};
    if(plannedStep === 'preview+blank') return {showPreview:true, method:'blank'};
    if(plannedStep === 'audio') return {showPreview:false, method: (SPEECH_SUPPORTED ? 'audio' : 'blank')};
    if(plannedStep === 'phonetic') return {showPreview:false, method: (w.ipa ? 'phonetic' : (SPEECH_SUPPORTED ? 'audio' : 'blank'))};
    // random
    var pool = LETTER_METHODS.filter(function(m){
      if(m === 'audio') return SPEECH_SUPPORTED;
      if(m === 'phonetic') return !!w.ipa;
      return true;
    });
    var m = pool[Math.floor(Math.random()*pool.length)];
    return {showPreview:false, method:m};
  }

  // ---------- REVIEW FLOW ----------
  var reviewQueue = [];
  var reviewIdx = 0;
  var reviewResults = {advanced:0, mastered:0, reset:0};
  var reviewStage = 'preview'; // 'preview' | 'test' | 'feedback'
  var reviewMethod = null;
  var reviewLastCorrect = null;
  var reviewSkeleton = null;
  var reviewLastValue = '';

  function renderReview(){
    if(route.reset){
      if(route.mode === 'cram'){
        reviewQueue = words.filter(function(w){ return isTestTier(w) && !w.mastered; });
      } else {
        reviewQueue = words.filter(isDue);
      }
      reviewQueue = reviewQueue.slice().sort(function(){ return Math.random()-0.5; });
      reviewIdx = 0;
      reviewResults = {advanced:0, mastered:0, reset:0};
      route.reset = false;
      startWordAttempt();
    }
    if(reviewQueue.length === 0){
      app.innerHTML = '<div class="empty-state"><span class="big">🎉</span>没有需要复习的词<br>去首页看看吧</div>'
        + '<div class="action-row"><button class="btn" id="backHomeBtn">返回首页</button></div>';
      document.getElementById('backHomeBtn').onclick = function(){ go({name:'home'}); };
      return;
    }
    if(reviewIdx >= reviewQueue.length){
      app.innerHTML = '<div class="empty-state"><span class="big">✅</span>本轮复习完成！<br>'
        + '进度推进：'+reviewResults.advanced+' 个　新掌握：'+reviewResults.mastered+' 个　重新开始：'+reviewResults.reset+' 个</div>'
        + '<div class="action-row"><button class="btn" id="backHomeBtn">返回首页</button></div>';
      document.getElementById('backHomeBtn').onclick = function(){ go({name:'home'}); };
      return;
    }

    var w = reviewQueue[reviewIdx];
    var html = '<div class="back-link" id="backHome">← 返回首页</div>';
    html += '<div class="review-wrap">';
    html += '<div class="review-progress">第 '+(reviewIdx+1)+' / '+reviewQueue.length+' 个'+(route.mode==='cram'?'　·　考前总复习':'')+'</div>';
    html += '<div class="review-round">'+roundLabel(w)+'</div>';

    if(reviewStage === 'preview'){
      html += previewPanelHtml(w);
    } else if(reviewStage === 'test'){
      html += testPanelHtml(w, false);
    } else {
      html += testPanelHtml(w, true);
      html += feedbackHtml(w);
    }
    html += '</div>';
    app.innerHTML = html;

    document.getElementById('backHome').onclick = function(){ go({name:'home'}); };
    bindReviewEvents(w);
  }

  function roundLabel(w){
    var n = w.checkpointIndex + 1;
    return '第 '+n+' 遍默写';
  }

  function startWordAttempt(){
    var w = reviewQueue[reviewIdx];
    if(!w) return;
    var plannedStep = ROUND_PLAN[Math.min(w.checkpointIndex, ROUND_PLAN.length-1)];
    var picked = pickRoundMethod(w, plannedStep);
    reviewMethod = picked.method;
    reviewSkeleton = (reviewMethod === 'partial') ? buildSkeleton(w.word) : null;
    reviewStage = picked.showPreview ? 'preview' : 'test';
    reviewLastCorrect = null;
    reviewLastValue = '';
    bindReviewEvents._autoplayed = false;
  }

  function previewPanelHtml(w){
    var html = '<div class="panel">';
    html += '<div class="preview-en">'+escapeHtml(w.word)+'</div>';
    if(w.ipa) html += '<div class="preview-ipa">'+escapeHtml(w.ipa)+'</div>';
    if(SPEECH_SUPPORTED){
      html += '<button class="audio-btn" id="playAudioBtn">🔊 播放读音</button>';
    }
    html += '<div class="preview-zh">'+escapeHtml(w.meaning)+'</div>';
    if(w.example) html += '<div class="preview-ex">'+escapeHtml(w.example)+'</div>';
    html += '</div>';
    html += '<div class="panel-actions"><button class="btn block" id="startBlindBtn">看完了，开始默写 →</button></div>';
    return html;
  }

  function testPanelHtml(w, locked){
    var html = '<div class="panel">';
    if(reviewMethod === 'audio'){
      html += '<div class="test-label">只听读音，写出这个词</div>';
      html += '<button class="audio-btn" id="playAudioBtn">🔊 播放读音</button>';
      html += '<div><input type="text" class="single-input '+(locked?(reviewLastCorrect?'correct':'wrong'):'')+'" id="singleInput" autocomplete="off" autocapitalize="off" spellcheck="false" '+(locked?'disabled':'')+' value="'+(locked?escapeHtml(reviewLastValue):'')+'"></div>';
    } else if(reviewMethod === 'phonetic'){
      html += '<div class="test-label">只看音标，写出这个词</div>';
      html += '<div class="phonetic-big">'+escapeHtml(w.ipa || '')+'</div>';
      html += '<div><input type="text" class="single-input '+(locked?(reviewLastCorrect?'correct':'wrong'):'')+'" id="singleInput" autocomplete="off" autocapitalize="off" spellcheck="false" '+(locked?'disabled':'')+' value="'+(locked?escapeHtml(reviewLastValue):'')+'"></div>';
    } else if(reviewMethod === 'blank'){
      html += '<div class="test-label">凭记忆写出这个词（不给字母提示）</div>';
      html += '<div><input type="text" class="single-input '+(locked?(reviewLastCorrect?'correct':'wrong'):'')+'" id="singleInput" autocomplete="off" autocapitalize="off" spellcheck="false" '+(locked?'disabled':'')+' value="'+(locked?escapeHtml(reviewLastValue):'')+'"></div>';
    } else if(reviewMethod === 'partial'){
      html += '<div class="test-label">补全中间缺的字母</div>';
      html += '<div class="letter-row" id="letterRow">';
      reviewSkeleton.forEach(function(seg, i){
        if(seg.type === 'fixed'){
          if(seg.ch === ' '){
            html += '<span class="letter-fixed space"></span>';
          } else {
            html += '<span class="letter-fixed">'+escapeHtml(seg.ch)+'</span>';
          }
        } else {
          var lockedCls = locked ? (reviewLastCorrect ? 'correct' : 'wrong') : '';
          var val = (locked && reviewLastValue) ? (reviewLastValue[i] || '') : '';
          html += '<input type="text" maxlength="1" class="letter-input '+lockedCls+'" data-idx="'+i+'" autocomplete="off" autocapitalize="off" spellcheck="false" '+(locked?'disabled':'')+' value="'+escapeHtml(val)+'">';
        }
      });
      html += '</div>';
    }
    if(!locked){
      html += '<div class="panel-actions"><button class="btn block" id="submitAnswerBtn">提交</button></div>';
    }
    html += '</div>';
    return html;
  }

  function feedbackHtml(w){
    var verdictClass = reviewLastCorrect ? 'correct' : 'wrong';
    var verdictText = reviewLastCorrect ? '✓ 拼对了！' : '✗ 拼错了';
    var html = '<div class="feedback-note">';
    html += '<div class="feedback-verdict '+verdictClass+'">'+verdictText+'</div>';
    html += '<b>正确拼写：</b>'+escapeHtml(w.word)+(w.ipa?'　'+escapeHtml(w.ipa):'')+'<br>';
    html += '<b>意思：</b>'+escapeHtml(w.meaning);
    if(w.example) html += '<br><b>例句：</b>'+escapeHtml(w.example);
    html += '</div>';
    html += '<div class="panel-actions"><button class="btn block" id="nextBtn">下一个 →</button></div>';
    return html;
  }

  function bindReviewEvents(w){
    var playBtn = document.getElementById('playAudioBtn');
    if(playBtn){
      playBtn.onclick = function(){ speak(w.word); };
      if(reviewStage === 'test' && reviewMethod === 'audio' && !bindReviewEvents._autoplayed){
        speak(w.word);
        bindReviewEvents._autoplayed = true;
      }
    }

    var startBlindBtn = document.getElementById('startBlindBtn');
    if(startBlindBtn){
      startBlindBtn.onclick = function(){
        reviewStage = 'test';
        renderReview();
      };
    }

    if(reviewMethod === 'partial' && reviewStage === 'test'){
      var letterInputs = Array.prototype.slice.call(document.querySelectorAll('.letter-input'));
      letterInputs.forEach(function(inp, idx){
        inp.oninput = function(){
          inp.value = inp.value.slice(0,1);
          if(inp.value && idx < letterInputs.length-1){ letterInputs[idx+1].focus(); }
        };
        inp.onkeydown = function(e){
          if(e.key === 'Backspace' && !inp.value && idx > 0){ letterInputs[idx-1].focus(); }
        };
      });
      if(letterInputs[0]) letterInputs[0].focus();
    }

    var singleInput = document.getElementById('singleInput');
    if(singleInput && reviewStage === 'test'){
      singleInput.focus();
      singleInput.onkeydown = function(e){
        if(e.key === 'Enter'){ submitAnswer(w); }
      };
    }

    var submitBtn = document.getElementById('submitAnswerBtn');
    if(submitBtn) submitBtn.onclick = function(){ submitAnswer(w); };

    var nextBtn = document.getElementById('nextBtn');
    if(nextBtn) nextBtn.onclick = function(){
      reviewIdx++;
      startWordAttempt();
      renderReview();
    };
  }

  function submitAnswer(w){
    var typed = '';
    if(reviewMethod === 'partial'){
      var letterInputs = Array.prototype.slice.call(document.querySelectorAll('.letter-input'));
      var valByIdx = {};
      letterInputs.forEach(function(inp){ valByIdx[inp.getAttribute('data-idx')] = inp.value || ''; });
      var built = '';
      reviewSkeleton.forEach(function(seg, i){
        built += (seg.type === 'fixed') ? seg.ch : (valByIdx[i] || '');
      });
      typed = built;
    } else {
      var singleInput = document.getElementById('singleInput');
      typed = singleInput ? singleInput.value : '';
    }
    reviewLastValue = typed;
    var correct = normalize(typed) === normalize(w.word);
    reviewLastCorrect = correct;

    if(correct){
      w.checkpointIndex += 1;
      if(w.checkpointIndex >= CHECKPOINTS.length){
        w.mastered = true;
        reviewResults.mastered++;
      } else {
        reviewResults.advanced++;
      }
    } else {
      w.cycleStart = todayStr();
      w.checkpointIndex = 0;
      w.mastered = false;
      reviewResults.reset++;
    }
    recompute(w);
    saveWords();

    reviewStage = 'feedback';
    renderReview();
  }

  // init
  go({name:'home'});
})();
</script>
</body>
