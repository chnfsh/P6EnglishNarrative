<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PSLE 英文题型专练</title>
<style>
  :root{
    --paper:#FAF6EC;
    --ink:#242422;
    --ink-soft:#5b564a;
    --rule:#d8cfb6;
    --gold:#a9822f;
    --blue:#2f5fa8;
    --card-shadow: 0 2px 0 rgba(36,36,34,0.06), 0 10px 24px -14px rgba(36,36,34,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(1200px 700px at 10% -10%, #fffdf6 0%, var(--paper) 45%),
      var(--paper);
    color:var(--ink);
    font-family:"Source Serif 4","Noto Serif SC","Songti SC", Georgia, "Times New Roman", serif;
    display:flex; align-items:center; justify-content:center;
    padding:32px 16px;
  }
  .wrap{max-width:760px; width:100%;}
  header{text-align:center; margin-bottom:36px;}
  header .kicker{font-family:Georgia,serif; font-size:12px; letter-spacing:3px; color:var(--gold); text-transform:uppercase;}
  header h1{font-size:28px; margin:8px 0 6px;}
  header p{color:var(--ink-soft); font-size:14px; margin:0;}
  .grid{display:grid; grid-template-columns:1fr; gap:18px;}
  @media(min-width:620px){.grid{grid-template-columns:1fr 1fr;}}
  a.card{
    display:block; text-decoration:none; color:inherit;
    background:#fffef9; border:1px solid var(--rule); border-radius:4px;
    box-shadow:var(--card-shadow); padding:26px 22px; position:relative;
    transition:transform .12s ease;
  }
  a.card:active{transform:scale(.985);}
  a.card::before{
    content:""; position:absolute; left:0; right:0; top:0; height:4px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 12px, transparent 12px 20px);
    opacity:.35;
  }
  .card .tag{font-family:Georgia,serif; font-size:11px; letter-spacing:2px; color:var(--gold); text-transform:uppercase;}
  .card h2{font-size:20px; margin:8px 0 8px;}
  .card p{font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin:0 0 14px;}
  .card .go{font-size:13px; color:var(--blue); font-weight:600;}
  footer{text-align:center; margin-top:30px; font-size:12px; color:var(--ink-soft);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">PSLE English Practice</div>
    <h1>PSLE 英文题型专练</h1>
    <p>选择下面一项开始练习</p>
  </header>
  <div class="grid">
    <a class="card" href="cloze.html">
      <div class="tag">Comprehension Cloze</div>
      <h2>综合填空专项训练</h2>
      <p>76 篇历年小学综合填空练习，按年份分类，自动批改并支持多个参考答案，配有错题本可反复重练。</p>
      <div class="go">进入练习 →</div>
    </a>
    <a class="card" href="writing.html">
      <div class="tag">Composition Writing</div>
      <h2>英文写作技巧小练习</h2>
      <p>小学英文写作技巧专项练习，涵盖多个写作要点的针对性小题。</p>
      <div class="go">进入练习 →</div>
    </a>
  </div>
  <footer>星洲做题家 · 人来世上，皆有题解</footer>
</div>
</body>
</html>
