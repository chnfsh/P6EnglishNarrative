<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>综合填空专项 · Comprehension Cloze</title>
<style>
  :root{
    --paper:#FAF6EC;
    --paper-shadow:#EDE6D3;
    --ink:#242422;
    --ink-soft:#5b564a;
    --rule:#d8cfb6;
    --red:#B5312C;
    --red-soft:#e7d4d1;
    --green:#3f6b4a;
    --green-soft:#dbe6dc;
    --gold:#a9822f;
    --card-shadow: 0 2px 0 rgba(36,36,34,0.06), 0 10px 24px -14px rgba(36,36,34,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 700px at 10% -10%, #fffdf6 0%, var(--paper) 45%),
      var(--paper);
    color:var(--ink);
    font-family: "Source Serif 4","Noto Serif SC","Songti SC", Georgia, "Times New Roman", serif;
    min-height:100vh;
    padding-bottom:64px;
  }
  .wrap{max-width:760px; margin:0 auto; padding:0 16px;}

  header.top{
    position:sticky; top:0; z-index:20;
    background:rgba(250,246,236,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--rule);
  }
  .top-inner{
    max-width:760px;margin:0 auto;padding:12px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand{display:flex; flex-direction:column; line-height:1.15; cursor:pointer;}
  .brand b{font-size:17px; letter-spacing:.5px;}
  .brand span{font-size:11px; color:var(--ink-soft); font-family:Georgia,serif; letter-spacing:1px;}
  .nav-btns{display:flex; gap:8px;}
  .pill-btn{
    border:1px solid var(--rule); background:#fff8ea; color:var(--ink);
    border-radius:999px; padding:7px 12px; font-size:13px; cursor:pointer;
    font-family:inherit; position:relative; white-space:nowrap;
  }
  .pill-btn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .badge-count{
    position:absolute; top:-7px; right:-7px; background:var(--red); color:#fff;
    font-size:10px; min-width:17px; height:17px; border-radius:999px;
    display:flex; align-items:center; justify-content:center; padding:0 3px;
    font-family: Georgia, serif;
  }

  h1.page-title{font-size:20px; margin:22px 0 4px; letter-spacing:.3px;}
  p.page-sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 20px; line-height:1.6;}

  /* ---- Home grid ---- */
  .year-section{
    border:1px solid var(--rule); border-radius:3px; background:#fffef9;
    margin-bottom:14px; overflow:hidden; box-shadow:var(--card-shadow);
  }
  .year-section > summary{
    list-style:none; cursor:pointer; padding:14px 18px; display:flex;
    align-items:center; justify-content:space-between; font-family:Georgia,serif;
    user-select:none;
  }
  .year-section > summary::-webkit-details-marker{display:none;}
  .year-section > summary .yr-label{font-size:17px; letter-spacing:.5px; color:var(--ink);}
  .year-section > summary .yr-meta{font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:10px;}
  .year-section > summary .chevron{transition:transform .15s ease; font-size:12px; color:var(--gold);}
  .year-section[open] > summary .chevron{transform:rotate(90deg);}
  .year-section .grid-inner{padding:0 16px 16px;}
  .note-flag{
    font-size:10.5px; color:#8a2f2b; border:1px dashed var(--red); padding:1px 6px;
    border-radius:3px; margin-left:6px; white-space:nowrap;
  }
  .grid{display:grid; grid-template-columns:1fr; gap:12px;}
  @media(min-width:560px){.grid{grid-template-columns:1fr 1fr;}}
  .card{
    background:#fffef9;
    border:1px solid var(--rule);
    border-radius:3px;
    box-shadow:var(--card-shadow);
    padding:14px 16px 16px;
    cursor:pointer;
    position:relative;
    transition:transform .12s ease;
  }
  .card:active{transform:scale(.985);}
  .card .idx{
    font-family:Georgia,serif; font-size:11px; color:var(--gold); letter-spacing:2px; text-transform:uppercase;
  }
  .card h3{margin:4px 0 6px; font-size:16px; line-height:1.3;}
  .card .meta{font-size:12px; color:var(--ink-soft); display:flex; gap:10px; align-items:center;}
  .card .score-chip{
    font-size:11px; padding:2px 7px; border-radius:999px; border:1px solid var(--rule);
    background:var(--paper-shadow);
  }
  .card .score-chip.good{background:var(--green-soft); border-color:var(--green); color:var(--green);}
  .card .score-chip.mid{background:#f4e9cf; border-color:var(--gold); color:#7a5e1f;}
  .card .score-chip.low{background:var(--red-soft); border-color:var(--red); color:var(--red);}
  .card .partial-flag{
    position:absolute; top:10px; right:10px; font-size:10px; color:#8a2f2b;
    border:1px dashed var(--red); padding:1px 6px; border-radius:3px; letter-spacing:1px;
  }

  /* ---- Passage practice ---- */
  .paper-sheet{
    background:#fffef9; border:1px solid var(--rule); border-radius:2px;
    box-shadow:var(--card-shadow); padding:22px 20px 26px; position:relative; margin-bottom:18px;
  }
  .paper-sheet::before{
    content:""; position:absolute; left:0; right:0; top:0; height:5px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 14px, transparent 14px 22px);
    opacity:.35;
  }
  .sheet-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; gap:10px;}
  .sheet-head h2{margin:0; font-size:18px;}
  .sheet-head .credit{font-size:11px; color:var(--ink-soft); font-style:italic; margin-top:3px;}
  .marks-tag{
    font-family:Georgia,serif; font-size:12px; color:var(--gold); border:1px solid var(--gold);
    padding:3px 8px; border-radius:2px; white-space:nowrap;
  }
  .passage-text{font-size:16px; line-height:2.15;}
  .passage-text p{margin:0 0 16px;}
  .blank-wrap{display:inline-block; position:relative; margin:0 2px; vertical-align:baseline;}
  .blank-num{
    font-size:10px; color:var(--gold); vertical-align:super; margin-right:1px; font-family:Georgia,serif;
  }
  input.blank-input{
    font-family:inherit; font-size:15.5px; border:none; border-bottom:1.6px dashed var(--ink-soft);
    background:transparent; width:88px; text-align:center; padding:1px 2px; color:var(--ink);
    outline:none;
  }
  input.blank-input:focus{border-bottom-color:var(--ink); background:#fbf3df;}
  .blank-wrap.correct input.blank-input{border-bottom:1.6px solid var(--green); color:var(--green); font-weight:600;}
  .blank-wrap.wrong input.blank-input{border-bottom:1.6px solid var(--red); color:var(--red); text-decoration:line-through; text-decoration-color:var(--red);}
  .mark-icon{font-size:13px; margin-left:1px;}
  .mark-icon.ok{color:var(--green);}
  .mark-icon.no{color:var(--red);}
  .correct-hint{
    display:block; font-size:11.5px; color:var(--red); font-family:"Noto Serif SC",serif;
    margin-top:-2px; line-height:1.4;
  }

  .action-row{display:flex; gap:10px; margin-top:6px; flex-wrap:wrap;}
  .btn{
    font-family:"Noto Serif SC",serif; font-size:14px; padding:10px 18px; border-radius:3px;
    border:1px solid var(--ink); background:var(--ink); color:var(--paper); cursor:pointer;
  }
  .btn.secondary{background:transparent; color:var(--ink); border:1px solid var(--rule);}
  .btn.danger{background:transparent; color:var(--red); border:1px solid var(--red);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  /* ---- Score stamp ---- */
  .stamp-zone{display:flex; align-items:center; gap:18px; margin:10px 0 20px; flex-wrap:wrap;}
  .stamp{
    width:92px; height:92px; border-radius:50%; border:3px solid var(--red); color:var(--red);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(-8deg); font-family:Georgia,serif; flex-shrink:0;
    animation:stampIn .35s ease-out;
  }
  .stamp b{font-size:26px; line-height:1;}
  .stamp span{font-size:10px; letter-spacing:2px; margin-top:3px;}
  @keyframes stampIn{from{transform:rotate(-8deg) scale(1.6); opacity:0;} to{transform:rotate(-8deg) scale(1); opacity:1;}}
  .stamp-msg{font-size:14px; color:var(--ink-soft); line-height:1.6;}

  /* ---- Wrong book ---- */
  .wb-group{margin-bottom:20px;}
  .wb-group h4{font-size:14px; margin:0 0 8px; color:var(--ink-soft); border-bottom:1px solid var(--rule); padding-bottom:6px;}
  .wb-item{
    background:#fffef9; border:1px solid var(--rule); border-left:3px solid var(--red);
    border-radius:2px; padding:10px 12px; margin-bottom:8px; font-size:13.5px; line-height:1.7;
  }
  .wb-item .ctx{color:var(--ink-soft);}
  .wb-item .ctx b{color:var(--ink); background:#f4e9cf; padding:0 3px; border-radius:2px;}
  .wb-item .ans-row{display:flex; justify-content:space-between; align-items:center; margin-top:6px; gap:8px;}
  .wb-item .ans{font-size:12.5px;}
  .wb-item .ans .yours{color:var(--red);}
  .wb-item .ans .right{color:var(--green);}
  .wb-item .rm-btn{
    font-size:11px; color:var(--ink-soft); background:none; border:1px solid var(--rule);
    border-radius:999px; padding:3px 9px; cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-soft); font-size:14px; line-height:1.8;
  }
  .empty-state .big{font-size:34px; display:block; margin-bottom:10px;}

  .back-link{
    display:inline-flex; align-items:center; gap:4px; font-size:13px; color:var(--ink-soft);
    cursor:pointer; margin:16px 0 4px; user-select:none;
  }
  .back-link:hover{color:var(--ink);}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:9px 18px; border-radius:4px; font-size:13px;
    box-shadow:0 8px 20px rgba(0,0,0,.25); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .hidden{display:none !important;}
  .review-tag{
    display:inline-block; font-size:11px; background:var(--red-soft); color:var(--red);
    border-radius:999px; padding:2px 9px; margin-bottom:12px;
  }
</style>
</head>

[[57]] being driven into rivers and oceans by the rain. Most of the mercury that ends up in the water [[58]] not easily absorbed by living things. After eating it, they are able to get [[59]] of it rather quickly, so it does not accumulate in their bodies. However, some types of bacteria in water converts this mercury into methylmercury. This form, on the [[60]] hand, is hard to excrete. Hence, over time, methylmercury gradually [[61]] up in the bodies of living things.\n\nIn a food chain, methylmercury is absorbed by algae in the water, then eaten by tiny organisms like shrimp and krill. They need to eat a lot of algae to survive, so the amount of methylmercury stored in [[62]] bodies increases the longer they live. Shrimp and krill are preyed on by fish, [[63]] are in turn eaten by bigger fish. Each fish then consumes and retains the methylmercury.\n\nAs a result, the largest fish species nearer [[64]] end of the food chain can accumulate up to ten million times the [[65]] of methylmercury that is found in seawater. Ultimately, mankind consumes this. Thus, if man does nothing to manage his actions on this earth, has he considered the final effects it has eventually?", "answers": {"51": ["place"], "52": ["to"], "53": ["from", "by"], "54": ["like", "such as"], "55": ["as"], "56": ["burning"], "57": ["before"], "58": ["is"], "59": ["rid"], "60": ["other"], "61": ["builds"], "62": ["their"], "63": ["which", "who"], "64": ["the top", "top", "the higher"], "65": ["amount", "level", "concentration"]}}, {"id": "scgs", "year": "未注明年份", "title": "SCGS - 洗发水的历史", "school": "SCGS", "credit": "Adapted from LiveScience.com", "text": "Shampooing can be complicated. First, there are the confusing instructions – lather, rinse, repeat. It does not say anything about stopping. Now, there is a [[51]], in progress, called the \"No Poo\" Movement, advocating no shampoo whatsoever.\n\nShampoo is indeed a modern invention. It was [[52]] around the end of the 19th century. According to de <script>
(function(){
  "use strict";
  var PASSAGES = JSON.parse(document.getElementById('passages-data').textContent);
  var PASSAGE_MAP = {};
  PASSAGES.forEach(function(p){ PASSAGE_MAP[p.id] = p; });

  var LS_PROGRESS = 'p6cloze_progress_v1';
  var LS_WRONGBOOK = 'p6cloze_wrongbook_v1';

  function loadJSON(key, fallback){
    try{
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function saveJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }

  var progress = loadJSON(LS_PROGRESS, {});     // { passageId: {best:0, attempts:0} }
  var wrongBook = loadJSON(LS_WRONGBOOK, []);   // [ {passageId, blank, correct:[..], yourAnswer, wrongCount, updatedAt} ]

  function persistProgress(){ saveJSON(LS_PROGRESS, progress); }
  function persistWrongBook(){ saveJSON(LS_WRONGBOOK, wrongBook); }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  function normalize(s){
    return (s || '').toString().trim().toLowerCase().replace(/[.,!?;:'"]/g,'').replace(/\s+/g,' ');
  }

  function isCorrect(passage, blankNum, userAns){
    var accepted = passage.answers[blankNum] || [];
    var n = normalize(userAns);
    if(!n) return false;
    return accepted.some(function(a){ return normalize(a) === n; });
  }

  function updateWrongBadge(){
    var badge = document.getElementById('wrongCountBadge');
    if(wrongBook.length > 0){
      badge.textContent = wrongBook.length > 99 ? '99+' : wrongBook.length;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }

  function scoreChipClass(pct){
    if(pct >= 80) return 'good';
    if(pct >= 50) return 'mid';
    return 'low';
  }

  // ---------- context sentence extraction ----------
  function paragraphContaining(passage, blankNum){
    var paras = passage.text.split(/\n\n+/);
    var token = '[['+blankNum+']]';
    for(var i=0;i<paras.length;i++){
      if(paras[i].indexOf(token) !== -1) return paras[i];
    }
    return passage.text;
  }
  function shortContext(passage, blankNum){
    var para = paragraphContaining(passage, blankNum);
    // split into sentences roughly, keep the one with the blank plus a little neighbor text
    var token = '[['+blankNum+']]';
    var idx = para.indexOf(token);
    var start = Math.max(0, para.lastIndexOf('.', idx - 40) + 1);
    var end = para.indexOf('.', idx + token.length + 40);
    if(end === -1) end = Math.min(para.length, idx + token.length + 60);
    var snippet = para.slice(start, end + 1).trim();
    return snippet.replace(token, '<b>____</b>');
  }

  // ---------- router ----------
  var app = document.getElementById('app');
  var route = {name:'home'};

  function go(r){
    route = r;
    render();
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
  }

  document.getElementById('navHome').onclick = function(){ go({name:'home'}); };
  document.getElementById('brandHome').onclick = function(){ go({name:'home'}); };
  document.getElementById('navWrong').onclick = function(){ go({name:'wrongbook'}); };

  function setActiveNav(){
    document.getElementById('navHome').classList.toggle('active', route.name==='home');
    document.getElementById('navWrong').classList.toggle('active', route.name==='wrongbook');
  }

  function render(){
    setActiveNav();
    updateWrongBadge();
    if(route.name === 'home') return renderHome();
    if(route.name === 'passage') return renderPassage(route.id, {reviewOnly:false});
    if(route.name === 'wrongbook') return renderWrongBook();
    if(route.name === 'wrongquiz') return renderWrongQuiz();
  }

  // ---------- HOME ----------
  var YEAR_ORDER = ["未注明年份","2019","2020","2021","2022","2023"];

  function renderHome(){
    var html = '';
    html += '<h1 class="page-title">选择一篇练习</h1>';
    html += '<p class="page-sub">共 '+PASSAGES.length+' 篇小学英语综合填空 (Comprehension Cloze)，按年份分组。每空可能有不止一个正确答案，系统会尽量识别近义的合理答案。答错的题目会自动收录进「错题本」。</p>';

    var byYear = {};
    PASSAGES.forEach(function(p){
      var y = p.year || '未注明年份';
      if(!byYear[y]) byYear[y] = [];
      byYear[y].push(p);
    });
    var years = YEAR_ORDER.filter(function(y){ return byYear[y]; });
    Object.keys(byYear).forEach(function(y){ if(years.indexOf(y) === -1) years.push(y); });

    years.forEach(function(y, yi){
      var list = byYear[y];
      var doneCount = list.filter(function(p){ return progress[p.id] && progress[p.id].attempts > 0; }).length;
      var openAttr = (yi === years.length - 1) ? ' open' : '';
      html += '<details class="year-section"'+openAttr+' data-year="'+escapeHtml(y)+'">';
      html += '<summary><span class="yr-label">'+escapeHtml(y)+'</span>'
            + '<span class="yr-meta">'+list.length+' 篇 · 已练习 '+doneCount+' 篇 <span class="chevron">▶</span></span></summary>';
      html += '<div class="grid-inner"><div class="grid">';
      list.forEach(function(p){
        var prog = progress[p.id];
        var total = Object.keys(p.answers).length;
        var chip = '';
        if(prog && prog.attempts > 0){
          var pct = Math.round(prog.best / total * 100);
          chip = '<span class="score-chip '+scoreChipClass(pct)+'">最佳 '+prog.best+'/'+total+'</span>';
        } else {
          chip = '<span class="score-chip">未练习</span>';
        }
        html += '<div class="card" data-id="'+p.id+'">'
          + (p.partial ? '<div class="partial-flag">残卷</div>' : '')
          + '<div class="idx">'+total+' BLANKS'+(p.note ? '<span class="note-flag">扫描还原</span>' : '')+'</div>'
          + '<h3>'+escapeHtml(p.title)+'</h3>'
          + '<div class="meta">'+chip+'</div>'
          + '</div>';
      });
      html += '</div></div></details>';
    });

    app.innerHTML = html;
    Array.prototype.forEach.call(app.querySelectorAll('.card'), function(el){
      el.onclick = function(){ go({name:'passage', id: el.getAttribute('data-id')}); };
    });
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  // ---------- PASSAGE PRACTICE ----------
  function buildPassageHTML(passage, opts){
    opts = opts || {};
    var paras = passage.text.split(/\n\n+/);
    var body = paras.map(function(para){
      var rendered = escapeHtml(para).replace(/\[\[(\d+)\]\]/g, function(_, num){
        return '{{BLANK:'+num+'}}';
      });
      // now split on the blank markers to inject real HTML (avoids escaping issues)
      var parts = rendered.split(/\{\{BLANK:(\d+)\}\}/);
      var out = '';
      for(var i=0;i<parts.length;i++){
        if(i % 2 === 0){
          out += parts[i];
        } else {
          var num = parts[i];
          out += '<span class="blank-wrap" data-blank="'+num+'">'
               + '<span class="blank-num">('+num+')</span>'
               + '<input class="blank-input" type="text" autocomplete="off" autocapitalize="off" '
               + 'spellcheck="false" data-blank-input="'+num+'" />'
               + '<span class="mark-icon"></span>'
               + '</span>';
        }
      }
      return '<p>'+out+'</p>';
    }).join('');
    return body;
  }

  function renderPassage(id){
    var passage = PASSAGE_MAP[id];
    if(!passage){ go({name:'home'}); return; }
    var total = Object.keys(passage.answers).length;

    var html = '';
    html += '<div class="back-link" id="backHome">← 返回篇章列表</div>';
    html += '<div class="paper-sheet">';
    html += '<div class="sheet-head"><div><h2>'+escapeHtml(passage.title)+'</h2>'
          + '<div class="credit">'+escapeHtml(passage.credit||'')+'</div>'
          + (passage.note ? '<div class="credit" style="color:#8a2f2b;">⚠ '+escapeHtml(passage.note)+'</div>' : '')
          + '</div>'
          + '<div class="marks-tag">'+total+' marks</div></div>';
    html += '<div class="passage-text" id="passageText">'+buildPassageHTML(passage)+'</div>';
    html += '<div id="stampZone"></div>';
    html += '<div class="action-row">'
          + '<button class="btn" id="checkBtn">提交检查 Check</button>'
          + '<button class="btn secondary" id="resetBtn">清空重做</button>'
          + '</div>';
    html += '</div>';
    app.innerHTML = html;

    document.getElementById('backHome').onclick = function(){ go({name:'home'}); };
    document.getElementById('resetBtn').onclick = function(){ renderPassage(id); };
    document.getElementById('checkBtn').onclick = function(){ gradePassage(passage); };

    // enter key moves to next blank
    var inputs = Array.prototype.slice.call(app.querySelectorAll('input.blank-input'));
    inputs.forEach(function(inp, idx){
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          if(idx < inputs.length -1) inputs[idx+1].focus();
          else document.getElementById('checkBtn').click();
        }
      });
    });
  }

  function gradePassage(passage){
    var total = Object.keys(passage.answers).length;
    var correctCount = 0;
    var wrongEntriesThisRound = [];

    Object.keys(passage.answers).forEach(function(num){
      var wrap = app.querySelector('.blank-wrap[data-blank="'+num+'"]');
      var input = wrap.querySelector('input.blank-input');
      var icon = wrap.querySelector('.mark-icon');
      var val = input.value;
      var ok = isCorrect(passage, num, val);
      input.disabled = true;
      wrap.classList.remove('correct','wrong');
      var existingHint = wrap.querySelector('.correct-hint');
      if(existingHint) existingHint.remove();

      if(ok){
        correctCount++;
        wrap.classList.add('correct');
        icon.textContent = '✓';
        icon.className = 'mark-icon ok';
        removeFromWrongBook(passage.id, num);
      } else {
        wrap.classList.add('wrong');
        icon.textContent = '✗';
        icon.className = 'mark-icon no';
        var hint = document.createElement('span');
        hint.className = 'correct-hint';
        hint.textContent = '参考答案：' + passage.answers[num].join(' / ');
        wrap.appendChild(hint);
        wrongEntriesThisRound.push({num: num, val: val});
        addToWrongBook(passage, num, val);
      }
    });

    // update progress
    var prev = progress[passage.id] || {best:0, attempts:0};
    prev.best = Math.max(prev.best, correctCount);
    prev.attempts += 1;
    progress[passage.id] = prev;
    persistProgress();
    persistWrongBook();
    updateWrongBadge();

    // stamp
    var pct = Math.round(correctCount/total*100);
    var stampZone = document.getElementById('stampZone');
    var msg = pct === 100 ? '全对！满分！' : (pct >= 80 ? '很不错，再接再厉。' : (pct >= 50 ? '还有进步空间，错题已收进错题本。' : '别灰心，多练几次就好，错题已收进错题本。'));
    stampZone.innerHTML = '<div class="stamp-zone">'
      + '<div class="stamp"><b>'+correctCount+'/'+total+'</b><span>SCORE</span></div>'
      + '<div class="stamp-msg">'+msg+(wrongEntriesThisRound.length? '<br>本次错 '+wrongEntriesThisRound.length+' 题。' : '')+'</div>'
      + '</div>';

    document.getElementById('checkBtn').disabled = true;
    showToast('已批改：'+correctCount+' / '+total);
  }

  function addToWrongBook(passage, num, yourAnswer){
    var idx = wrongBook.findIndex(function(w){ return w.passageId===passage.id && w.blank===num; });
    var entry = {
      passageId: passage.id,
      passageTitle: passage.title,
      blank: num,
      correct: passage.answers[num],
      yourAnswer: yourAnswer || '(空白未作答)',
      wrongCount: 1,
      updatedAt: Date.now()
    };
    if(idx === -1){
      wrongBook.push(entry);
    } else {
      wrongBook[idx].yourAnswer = entry.yourAnswer;
      wrongBook[idx].wrongCount += 1;
      wrongBook[idx].updatedAt = Date.now();
    }
  }
  function removeFromWrongBook(passageId, num){
    wrongBook = wrongBook.filter(function(w){ return !(w.passageId===passageId && w.blank===num); });
  }

  // ---------- WRONG BOOK ----------
  function renderWrongBook(){
    var html = '';
    html += '<h1 class="page-title">错题本</h1>';
    html += '<p class="page-sub">收录了历次练习中答错的题目。可以针对错题专项重练，答对后会自动从错题本移除。</p>';

    if(wrongBook.length === 0){
      html += '<div class="empty-state"><span class="big">📗</span>暂时没有错题，太棒了！<br>去「全部篇章」里练习一篇试试吧。</div>';
      app.innerHTML = html;
      return;
    }

    html += '<div class="action-row" style="margin-bottom:18px;">'
          + '<button class="btn" id="startWrongQuiz">开始错题重练（共 '+wrongBook.length+' 题）</button>'
          + '</div>';

    var byPassage = {};
    wrongBook.forEach(function(w){
      if(!byPassage[w.passageId]) byPassage[w.passageId] = [];
      byPassage[w.passageId].push(w);
    });

    Object.keys(byPassage).forEach(function(pid){
      var items = byPassage[pid];
      var passage = PASSAGE_MAP[pid];
      html += '<div class="wb-group"><h4>'+escapeHtml(items[0].passageTitle)+' （'+items.length+' 题）</h4>';
      items.sort(function(a,b){ return parseInt(a.blank)-parseInt(b.blank); });
      items.forEach(function(w){
        var ctx = passage ? shortContext(passage, w.blank) : '';
        html += '<div class="wb-item" data-pid="'+pid+'" data-blank="'+w.blank+'">'
          + '<div class="ctx">('+w.blank+') '+ctx+'</div>'
          + '<div class="ans-row"><div class="ans">你的答案：<span class="yours">'+escapeHtml(w.yourAnswer)+'</span>　正确答案：<span class="right">'+escapeHtml(w.correct.join(' / '))+'</span></div>'
          + '<button class="rm-btn" data-rm="1">移除</button></div>'
          + '</div>';
      });
      html += '</div>';
    });

    app.innerHTML = html;
    document.getElementById('startWrongQuiz').onclick = function(){ go({name:'wrongquiz'}); };
    Array.prototype.forEach.call(app.querySelectorAll('.wb-item .rm-btn'), function(btn){
      btn.onclick = function(){
        var item = btn.closest('.wb-item');
        removeFromWrongBook(item.getAttribute('data-pid'), item.getAttribute('data-blank'));
        persistWrongBook();
        renderWrongBook();
        updateWrongBadge();
      };
    });
  }

  // ---------- WRONG QUIZ (targeted review) ----------
  function renderWrongQuiz(){
    if(wrongBook.length === 0){ go({name:'wrongbook'}); return; }
    var html = '';
    html += '<div class="back-link" id="backWB">← 返回错题本</div>';
    html += '<span class="review-tag">错题重练模式</span>';
    html += '<div class="paper-sheet"><div class="passage-text" id="wqBody">';

    var snapshot = wrongBook.slice(); // snapshot so list doesn't shift mid-quiz
    snapshot.forEach(function(w, i){
      var passage = PASSAGE_MAP[w.passageId];
      var ctx = passage ? shortContext(passage, w.blank) : '';
      html += '<p style="font-size:15px;">'
        + '<span class="blank-num" style="font-size:11px;">'+(i+1)+'. ['+escapeHtml(w.passageTitle)+']</span> '
        + ctx.replace('<b>____</b>',
            '<span class="blank-wrap" data-pid="'+w.passageId+'" data-blank="'+w.blank+'">'
            + '<input class="blank-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />'
            + '<span class="mark-icon"></span></span>')
        + '</p>';
    });
    html += '</div>';
    html += '<div class="action-row"><button class="btn" id="checkWQ">提交检查 Check</button></div>';
    html += '</div>';
    app.innerHTML = html;
    document.getElementById('backWB').onclick = function(){ go({name:'wrongbook'}); };
    document.getElementById('checkWQ').onclick = function(){ gradeWrongQuiz(); };
  }

  function gradeWrongQuiz(){
    var wraps = Array.prototype.slice.call(app.querySelectorAll('#wqBody .blank-wrap'));
    var correctCount = 0;
    wraps.forEach(function(wrap){
      var pid = wrap.getAttribute('data-pid');
      var blank = wrap.getAttribute('data-blank');
      var passage = PASSAGE_MAP[pid];
      var input = wrap.querySelector('input');
      var icon = wrap.querySelector('.mark-icon');
      var val = input.value;
      var ok = passage && isCorrect(passage, blank, val);
      input.disabled = true;
      if(ok){
        correctCount++;
        wrap.classList.add('correct');
        icon.textContent = '✓'; icon.className = 'mark-icon ok';
        removeFromWrongBook(pid, blank);
      } else {
        wrap.classList.add('wrong');
        icon.textContent = '✗'; icon.className = 'mark-icon no';
        if(passage) addToWrongBook(passage, blank, val);
      }
    });
    persistWrongBook();
    updateWrongBadge();
    var total = wraps.length;
    showToast('本轮重练：'+correctCount+' / '+total+' 已掌握');
    document.getElementById('checkWQ').disabled = true;
    var backBtn = document.createElement('button');
    backBtn.className = 'btn secondary';
    backBtn.textContent = '返回错题本';
    backBtn.style.marginLeft = '8px';
    backBtn.onclick = function(){ go({name:'wrongbook'}); };
    document.querySelector('.action-row').appendChild(backBtn);
  }

  // init
  updateWrongBadge();
  render();
})();
</script>
</body>
</html>
